name: 更新体育资讯
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 聚合 RSS
        run: python scripts/collect_feeds.py
      - name: 提交数据更新
        run: |
          git config user.name "sideline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/feed.json
          git diff --cached --quiet || git commit -m "data: refresh sports feeds"
          git push
